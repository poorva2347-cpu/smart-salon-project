<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Smart Salon</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../auth.css" />
</head>

<body>

  <!-- ═══════ PAGE ═══════ -->
  <main class="auth-page">
    <div class="auth-card">

      <!-- Brand -->
      <div class="auth-brand">
        <div class="auth-brand-logo">
          <img src="../logo/smart-salon-logo-navy.svg" alt="Smart Salon" class="auth-logo-img" />
        </div>
        <div class="auth-brand-tagline">AI-Assisted Booking Platform</div>
      </div>

      <!-- Heading -->
      <div class="auth-heading">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to manage your bookings and appointments.</p>
      </div>

      <!-- Form -->
      <form class="auth-form" id="login-form" novalidate>

        <!-- Email -->
        <div class="auth-fg" id="fg-email">
          <label class="auth-label" for="login-email">Email Address</label>
          <div class="auth-input-wrap">
            <i class="fa fa-envelope auth-input-icon" aria-hidden="true"></i>
            <input
              class="auth-input"
              type="email"
              id="login-email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              aria-describedby="err-email"
              aria-required="true"
            />
          </div>
          <span class="auth-error" id="err-email" role="alert" aria-live="polite"></span>
        </div>

        <!-- Password -->
        <div class="auth-fg" id="fg-password">
          <label class="auth-label" for="login-password">Password</label>
          <div class="auth-input-wrap">
            <i class="fa fa-lock auth-input-icon" aria-hidden="true"></i>
            <input
              class="auth-input has-eye"
              type="password"
              id="login-password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              aria-describedby="err-password"
              aria-required="true"
            />
            <button
              type="button"
              class="auth-eye-btn"
              id="eye-password"
              onclick="togglePasswordVisibility('login-password', this)"
              aria-label="Show password"
            >
              <i class="fa fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <span class="auth-error" id="err-password" role="alert" aria-live="polite"></span>
        </div>

        <!-- Submit -->
        <button type="submit" class="auth-btn-primary" id="login-btn">
          Sign In
        </button>

      </form>

      <!-- Footer -->
      <div class="auth-footer">
        <p class="auth-footer-text">
          Don't have an account?
          <a href="register.html" class="auth-link">Create Account</a>
        </p>
      </div>

    </div>
  </main>

  <script src="../js/auth.js"></script>
</body>

</html>
